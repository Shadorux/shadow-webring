<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Shadow Webring — Connecting…</title>
  <style>body{background:#080808;color:#eee;font:16px ui-monospace,monospace;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#e31322}</style>
</head>
<body>
  <p id="status">ESTABLISHING CONNECTION…</p>
  <script>
    const status = document.querySelector('#status');
    const params = new URLSearchParams(location.search);
    const currentId = params.get('site');
    const direction = params.get('to');

    fetch('./sites.json', { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('Could not load registry');
        return r.json();
      })
      .then(sites => {
        if (!Array.isArray(sites) || !sites.length) throw new Error('The ring is empty');
        const index = sites.findIndex(site => site.id === currentId);
        if (index < 0) throw new Error('Unknown member site');

        let target;
        if (direction === 'prev') target = sites[(index - 1 + sites.length) % sites.length];
        else if (direction === 'next') target = sites[(index + 1) % sites.length];
        else if (direction === 'random') {
          const choices = sites.length > 1 ? sites.filter((_, i) => i !== index) : sites;
          target = choices[Math.floor(Math.random() * choices.length)];
        } else throw new Error('Unknown navigation direction');

        location.replace(target.url);
      })
      .catch(error => {
        status.innerHTML = `CONNECTION FAILED: ${error.message}. <a href="./">Return to the ring</a>`;
      });
  </script>
</body>
</html>
